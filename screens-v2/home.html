  const BROWSE_ON = false; // 전체 보기 — 버튼은 보이고 눌리지만 아직 화면은 열지 않는다. true로 바꾸면 다시 열린다
  const SHELF = { continue: ["psg", "film", "audio", "amelie"], film: CAT.film.items.slice(0, 4).map((x) => x.id), live: firstOf("live"), music: firstOf("music") };
  const TAB_KEY = { continue: "continue", film: "tab_film", live: "tab_live", music: "m_music" };
  const VIEWS = {};

  /* ── 감상: 대표 콘텐츠 / 탭 / 포스터 4 ── */
  const mealFloat = () => {
    const m = S.meal;
    return `<div class="card meal-float"><span class="notice__icon">${icon("meal")}</span><div>
      <p class="notice__title">${t(m ? `meal_${m}_t` : "meal_title")}</p>
      <p class="notice__body">${t(m ? `meal_${m}_b` : "meal_body")}</p>
      <div class="actions">${m ? `<button class="btn btn--text" type="button" data-meal="">${t("change")}</button>` : `<button class="btn btn--primary" type="button" data-meal="later">${t("meal_later")}</button><button class="btn btn--ghost" type="button" data-meal="now">${t("meal_now")}</button>`}</div>
    </div></div>`;
  };
  const COLS4 = ["c1-3", "c4-6", "c7-9", "c10-12b"];
  const poster = (k, i) => {
    const m = media(k), bar = m.pos ? `<span class="bar"><i style="width:${(m.pos / m.dur) * 100}%"></i></span>` : "";
    const kind = `<span class="poster__kind">${m.live ? `<span class="live-dot">${m.kind}</span>` : m.kind}</span>`;
    return `<button class="poster ${COLS4[i]}" type="button" data-play="${k}"><img src="${m.src}" alt="">${kind}<span class="poster__title">${m.title}</span>${bar}</button>`;
  };
  VIEWS.ENJOY = () => {
    const inList = S.myList.includes("psg");
    return `
    <section class="enjoy-feature c1-12">
      <img src="../assets/enjoy/psg-lyon.jpg" alt="">
      <div class="enjoy-feature__body">
        <p class="eyebrow"><span class="live-dot">LIVE</span><i></i>LIGUE 1</p>
        <h1 class="enjoy-feature__title">PSG vs. Lyon</h1>
        <div class="actions">
          <button class="btn btn--primary btn--lg" type="button" data-play="psg">${icon("play")}${t("watch_live")}</button>
          <button class="btn btn--ghost btn--lg" type="button" data-play-start="psg">${t("watch_from_start")}</button>
          <button class="btn btn--ghost btn--lg" type="button" data-mylist="psg" aria-pressed="${inList}">${icon(inList ? "check" : "plus")}${t("my_list")}</button>
        </div>
      </div>
      ${mealFloat()}
    </section>
    <div class="shelf-head c1-12">
      <div class="tabs" role="tablist">${Object.keys(SHELF).map((k) => `<button type="button" role="tab" aria-selected="${S.tab === k}" data-tab="${k}">${t(TAB_KEY[k])}</button>`).join("")}</div>
      ${S.tab === "continue" ? `<span class="card__more">${t("continue_note")}</span>` : `<button class="btn btn--ghost browse-btn" type="button" data-browse="${S.tab}">${t("browse_all")} <span class="num">${CAT[S.tab].items.length}</span>${icon("right")}</button>`}
    </div>
    ${SHELF[S.tab].slice(0, 4).map(poster).join("")}`;
  };

  /* ── 휴식: 왼쪽 8칸(문구·수면 시간대·시각·잠들기) / 오른쪽 4칸(조명·소리·깨울 순간·좌석) ── */
  const PRESETS = { sleep: { light: "dark", sound: "ss_white", pose: "bed" }, relax: { light: "soft", sound: "ss_rain", pose: "lounge" }, read: { light: "bright", sound: "ss_none", pose: "upright" } };
  /* 휴식·업무·준비·여행 — 카드 대신 괘선과 타이포로 짠 열린 레이아웃. 클래스는 x-(공통) r-(휴식) w-(업무) p-(준비) t-(여행) */
  const opt = (key, val, ic, cur, label) => `<button class="x-opt" type="button" data-${key}="${val}" aria-pressed="${cur === val}">${icon(ic)}<span>${label}</span></button>`;
  const stepper = (key) => `<div class="stepper"><button type="button" data-shift="${key}" data-d="-15" aria-label="-15">${icon("left")}</button><button type="button" data-shift="${key}" data-d="15" aria-label="+15">${icon("right")}</button></div>`;

  VIEWS.REST = () => {
    const pct = (at) => (at / TOTAL) * 100;
    const presetOn = (k) => PRESETS[k].light === S.restLight && PRESETS[k].sound === S.soundscape && PRESETS[k].pose === S.seatPose;
    return `
    <div class="x-root r-root">
      <header class="r-head">
        <div><h1 class="x-h1">${t("rest_head")}</h1><p class="x-sub">${t("rest_sub")}</p></div>
        <div class="r-head__act">
          <div class="x-tabs" role="group">${Object.keys(PRESETS).map((k) => `<button type="button" data-preset="${k}" aria-pressed="${presetOn(k)}">${t("preset_" + k)}</button>`).join("")}</div>
          <button class="btn btn--primary btn--lg" type="button" data-sleep-now>${icon("moon")}${t("sleep_now")}</button>
        </div>
      </header>
      <section class="r-time">
        <div class="r-time__row">
          <div class="r-t"><p class="x-cap">${t("bedtime")}</p><div class="r-t__line"><span class="r-t__v">${clock(S.sleepAt)}</span>${stepper("sleepAt")}</div></div>
          <div class="r-t"><p class="x-cap">${t("waketime")}</p><div class="r-t__line"><span class="r-t__v">${clock(S.wakeAt)}</span>${stepper("wakeAt")}</div></div>
          <div class="r-t r-t--sum"><p class="x-cap">${t("sleep_window")}</p><div class="r-t__line"><span class="r-t__v">${P.hm(S.wakeAt - S.sleepAt)}</span></div></div>
        </div>
        <div class="r-track"><span class="r-win" style="left:${pct(S.sleepAt)}%;width:${pct(S.wakeAt - S.sleepAt)}%"></span><span class="r-now" style="left:${pct(elapsed)}%"></span></div>
        <div class="r-ticks"><span>${t("now")} ${clock(elapsed)}</span><span>${clock(TOTAL / 2)}</span><span>${t("arrive")} 07:30</span></div>
      </section>
      <section class="r-ctl">
        <div class="r-col"><p class="x-cap">${t("light_level")}</p>${opt("rl", "bright", "sunfull", S.restLight, t("lv_bright"))}${opt("rl", "soft", "half", S.restLight, t("lv_soft"))}${opt("rl", "dark", "moon", S.restLight, t("lv_dark"))}</div>
        <div class="r-col"><p class="x-cap">${t("soundscape")}</p>${opt("ss", "ss_none", "mute", S.soundscape, t("ss_none"))}${opt("ss", "ss_white", "wave", S.soundscape, t("ss_white"))}${opt("ss", "ss_rain", "rain", S.soundscape, t("ss_rain"))}</div>
        <div class="r-col"><p class="x-cap">${t("seat_quick")}</p>${opt("pose", "upright", "seat-up", S.seatPose, t("upright"))}${opt("pose", "lounge", "seat-lounge", S.seatPose, t("lounge"))}${opt("pose", "bed", "seat-bed", S.seatPose, t("bed"))}</div>
        <div class="r-col"><p class="x-cap">${t("wake_title")}</p>
          <div class="x-row"><span>${t("wake_meal")} <span class="x-dim num">${clock(S.wakeAt)}</span></span><button class="switch" type="button" role="switch" aria-checked="${S.wakeMeal}" data-sw="wakeMeal"><i></i></button></div>
          <div class="x-row"><span>${t("wake_land")}</span><button class="switch" type="button" role="switch" aria-checked="${S.wakeLand}" data-sw="wakeLand"><i></i></button></div>
          <button class="x-row x-row--btn" type="button" data-play="audio"><span><span class="x-dim">${t("playlist")}</span><br>Night Crossing</span>${icon("play")}</button>
        </div>
      </section>
    </div>`;
  };

  /* ── 업무 ── */
  let focusLeft = S.focusLen * 60, focusTimer = 0, heldOpen = false;
  VIEWS.WORK = () => `
    <div class="x-root w-root">
      <section class="w-main">
        <h1 class="x-h1 w-h1">${t("work_head")}</h1>
        <p class="x-sub">${t("sessions", Math.floor((TOTAL - elapsed) / (S.focusLen + 5)))}</p>
        <p class="timer w-timer" data-timer>${fmt(focusLeft)}</p>
        <div class="w-line"><i data-timer-bar style="width:${(1 - focusLeft / (S.focusLen * 60)) * 100}%"></i></div>
        <div class="w-ctrl">
          <div class="actions"><button class="btn btn--primary btn--lg" type="button" data-focus>${icon(focusTimer ? "pause" : "play")}${t(focusTimer ? "pause" : "start")}</button><button class="btn btn--ghost btn--lg" type="button" data-focus-reset>${t("timer_reset")}</button></div>
          <div class="x-tabs" role="group">${[25, 50, 90].map((m) => `<button type="button" data-len="${m}" aria-pressed="${S.focusLen === m}">${t("min_fmt", m)}</button>`).join("")}</div>
        </div>
      </section>
      <aside class="w-side">
        <section class="w-sec"><div class="x-head"><p class="x-cap">${t("wifi_title")}</p><span class="x-tag">ON</span></div>
          <p class="w-speed num">38<small> Mbps</small></p><p class="x-dim">${t("wifi_on")} · ${t("wifi_plan")} · ↓ 38 ↑ 12</p></section>
        <section class="w-sec"><div class="x-head"><p class="x-cap">${t("held_title")} <b class="num">2</b></p><button class="x-link" type="button" data-held>${t(heldOpen ? "close" : "show_now")}</button></div>
          <div class="w-held${heldOpen ? "" : " is-hidden"}">
            <div class="x-row"><span>${t("meal_title")}</span><span class="x-dim num">${clock(132)}</span></div>
            <div class="x-row"><span>${t("n_match")}</span><span class="x-dim num">${clock(128)}</span></div>
          </div></section>
        <section class="w-sec"><p class="x-cap">${t("workspace")}</p>
          <div class="x-row"><span>${t("focus_light")}</span><button class="switch" type="button" role="switch" aria-checked="${S.taskLight}" data-sw="taskLight"><i></i></button></div>
          <div class="x-row"><span>${t("hold_alerts")}<small class="x-dim x-sm">${t("hold_desc")}</small></span><button class="switch" type="button" role="switch" aria-checked="${S.holdAlerts}" data-sw="holdAlerts"><i></i></button></div></section>
        <button class="x-row x-row--btn w-music" type="button" data-play="focus"><span><span class="x-dim">${t("focus_music")} · PLAYLIST 24</span><br>Deep Focus</span>${icon("play")}</button>
      </aside>
    </div>`;

  /* ── 준비 ── */
  VIEWS.PREPARE = () => {
    const meta = { 1: "25'", 2: "15'", 3: { tr1: "35'", tr2: "50'", tr3: "60'" }[S.route] };
    return `
    <div class="x-root p-root">
      <header class="p-head">
        <div><h1 class="x-h1">${t("prep_head")}</h1></div>
        <dl class="p-facts">
          <div><dt>Arrival</dt><dd>07:30</dd></div><div><dt>Terminal</dt><dd>2E</dd></div><div><dt>Belt</dt><dd>31</dd></div><div><dt>Weather</dt><dd>16°</dd></div><div><dt>EUR</dt><dd>₩1,480</dd></div>
        </dl>
      </header>
      <div class="p-body">
        <section class="p-steps">
          <div class="x-head"><p class="x-cap">${t("checklist")}</p><span class="x-dim num">${S.steps.length} / 3 · ${t("prep_total")}</span></div>
          ${[1, 2, 3].map((i) => { const done = S.steps.includes(i); return `
          <button class="p-step${done ? " is-done" : ""}" type="button" data-step="${i}"><span class="p-step__n">${done ? icon("check") : i}</span><span class="p-step__t"><b>${t(`step${i}`)}</b><span class="x-dim">${t(`step${i}x`)} · ${t(`step${i}d`)}</span></span><span class="p-step__m num">${meta[i]}</span></button>`; }).join("")}
        </section>
        <aside class="p-side">
          <section><div class="x-head"><p class="x-cap">${t("transport")}</p></div>
            <div role="radiogroup">${[["tr1", "train"], ["tr2", "car"], ["tr3", "bus"]].map(([k, ic]) => `
            <button class="p-tr" type="button" role="radio" aria-checked="${S.route === k}" data-route="${k}">${icon(ic)}<span class="p-tr__n">${t(k)}${k === "tr1" ? `<span class="x-tag">${t("best")}</span>` : ""}</span><span class="x-dim num">${t(k + "d")}</span></button>`).join("")}</div></section>
          <section class="p-route"><div><p class="x-cap">${t("route")}</p><p class="p-route__l">${t(S.route + "r")}</p><p class="x-dim">${t("qr_desc")}</p>
            <button class="btn btn--primary btn--lg" type="button" data-open="qr">${icon("phone")}${t("send")}</button></div>
            ${qrSvg(132).replace("<svg ", '<svg class="qr-mini" ')}</section>
        </aside>
      </div>
    </div>`;
  };

  /* ── 여행 ── */
  const PLACES = [["p1", "landing-paris-amber", "cat_walk"], ["p2", "concept-light", "cat_art"], ["p3", "dawn", "cat_cafe"], ["p4", "paris", "cat_walk"], ["p5", "window", "cat_art"], ["p6", "overhead", "cat_cafe"], ["p7", "prepare-amber", "cat_walk"], ["p8", "concept-flow", "cat_art"], ["p9", "board-amber", "cat_cafe"]];
  VIEWS.TRAVEL = () => {
    const shown = PLACES.filter((p) => S.cat === "cat_all" || p[2] === S.cat).slice(0, 3);
    return `
    <div class="x-root t-root">
      <header class="t-head">
        <div><h1 class="t-city">Paris</h1></div>
        <dl class="p-facts t-facts"><div><dt>${t("weather")}</dt><dd>16°</dd></div><div><dt>${t("arrive")}</dt><dd>07:30</dd></div></dl>
      </header>
      <div class="t-body">
        <section class="t-list">
          <div class="x-head"><p class="x-cap">${t("discover")}</p>
            <div class="x-tabs" role="tablist">${["cat_all", "cat_walk", "cat_art", "cat_cafe"].map((c) => `<button type="button" role="tab" aria-selected="${S.cat === c}" data-cat="${c}">${t(c)}</button>`).join("")}</div></div>
          ${shown.map(([k, , cat], i) => `
          <article class="t-place"><span class="t-place__i num">0${i + 1}</span><div class="t-place__t"><b>${t(k)}</b><span class="x-dim">${t(k + "d")}</span></div><span class="x-tag">${t(cat)}</span>
            <button class="save-btn" type="button" data-place="${k}" aria-pressed="${S.saved.includes(k)}">${t(S.saved.includes(k) ? "saved_place" : "save_place")}</button></article>`).join("")}
        </section>
        <aside class="t-side">
          <section><div class="x-head"><p class="x-cap">${t("my_plan")}</p><span class="x-dim num">${S.saved.length}</span></div>
            ${S.saved.length ? S.saved.slice(0, 7).map((k) => `<div class="x-row"><span>${t(k)}</span>${icon("pin")}</div>`).join("") : `<p class="x-dim">${t("plan_empty")}</p>`}</section>
          <section><div class="x-head"><p class="x-cap">${t("record")}</p><span class="x-dim">${t("entries", S.entries.length)}</span></div>
            <p class="t-note">${S.entries.length ? esc(S.entries[S.entries.length - 1].text) : t("record_ph")}</p>
            <div class="actions"><button class="btn btn--primary" type="button" data-open="journal">${icon("pen")}${t("record_save")}</button><button class="btn btn--ghost" type="button" data-open="share">${icon("share")}${t("share")}</button></div></section>
        </aside>
      </div>
    </div>`;
  };

  const render = (animate) => {
    view.dataset.mode = S.mode;
    view.innerHTML = VIEWS[S.mode]();
    if (animate) { view.classList.remove("is-swap"); void view.offsetWidth; view.classList.add("is-swap"); }
  };
  const setMode = (m, { quiet = false } = {}) => {
    S.mode = m; P.save();
    stage.dataset.mode = m;
    stage.dataset.restLight = S.restLight;
    $("[data-mode-name]").textContent = t(`name_${m}`);
    showBg(); render(true);
    if (!quiet) P.toast(t("t_mode", t(`name_${m}`)));
  };

  /* 화면 안 동작 */
  view.addEventListener("click", (e) => {
    const el = e.target.closest("button"); if (!el || el.dataset.open) return;
    const d = el.dataset;
    if (d.play) return openPlayer(d.play);
    if (d.playStart) return openPlayer(d.playStart, true);
    if (d.mylist) { const k = d.mylist, had = S.myList.includes(k); S.myList = had ? S.myList.filter((x) => x !== k) : [...S.myList, k]; P.save(); render(); if (!had) P.toast(t("t_saved")); return; }
    if (d.tab) { S.tab = d.tab; P.save(); render(); return; }
    if (d.browse) return BROWSE_ON ? openBrowse(d.browse) : undefined;
    if (d.meal !== undefined) { S.meal = d.meal || null; P.save(); render(); return; }
    if (d.preset) { const x = PRESETS[d.preset]; S.restLight = x.light; S.soundscape = x.sound; S.seatPose = x.pose; P.save(); stage.dataset.restLight = S.restLight; render(); P.toast(t("preset_" + d.preset)); return; }
    if (d.rl) { S.restLight = d.rl; P.save(); stage.dataset.restLight = S.restLight; render(); return; }
    if (d.ss) { S.soundscape = d.ss; P.save(); render(); return; }
    if (d.shift) {
      const v = S[d.shift] + +d.d;
      if (d.shift === "sleepAt") S.sleepAt = Math.min(Math.max(v, elapsed + 15), S.wakeAt - 120); else S.wakeAt = Math.min(Math.max(v, S.sleepAt + 120), 790);
      P.save(); render(); return;
    }
    if (d.sw) { S[d.sw] = !S[d.sw]; P.save(); el.setAttribute("aria-checked", S[d.sw]); return; }
    if (d.sleepNow !== undefined) return goSleep();
    if (d.focus !== undefined) return toggleFocus();
    if (d.focusReset !== undefined) { clearInterval(focusTimer); focusTimer = 0; focusLeft = S.focusLen * 60; render(); return; }
    if (d.len) { clearInterval(focusTimer); focusTimer = 0; S.focusLen = +d.len; focusLeft = S.focusLen * 60; P.save(); render(); return; }
    if (d.held !== undefined) { heldOpen = !heldOpen; render(); return; }
    if (d.step) { const i = +d.step; S.steps = S.steps.includes(i) ? S.steps.filter((x) => x !== i) : [...S.steps, i]; P.save(); render(); return; }
    if (d.route) { S.route = d.route; P.save(); render(); P.toast(t("t_route", t(d.route))); return; }
    if (d.pose) { S.seatPose = d.pose; P.save(); render(); P.toast(t("t_seat", t(S.seatPose))); return; }
    if (d.cat) { S.cat = d.cat; P.save(); render(); return; }
    if (d.place) { const k = d.place, had = S.saved.includes(k); S.saved = had ? S.saved.filter((x) => x !== k) : [...S.saved, k]; P.save(); render(); if (!had) P.toast(t("t_saved")); return; }
  });

  const toggleFocus = () => {
    if (focusTimer) { clearInterval(focusTimer); focusTimer = 0; render(); return; }
    focusTimer = setInterval(() => {
      focusLeft = Math.max(0, focusLeft - 1);
      const el = $("[data-timer]"), bar = $("[data-timer-bar]");
      if (el) el.textContent = fmt(focusLeft);
      if (bar) bar.style.width = `${(1 - focusLeft / (S.focusLen * 60)) * 100}%`;
      if (!focusLeft) { clearInterval(focusTimer); focusTimer = 0; focusLeft = S.focusLen * 60; P.toast(t("t_focus_done")); if (S.mode === "WORK") render(); }
    }, 1000);
    render();
  };

  /* 전체 보기 — 분류별 섹션. 영화는 세로 포스터, 음악은 앨범, 라이브는 가로 카드 */
  const COUNT_KEY = { film: "titles_n", music: "albums_n", live: "channels_n" };
  const tile = (k) => { const m = media(k); return `<button class="tile is-${m.art}" type="button" data-play="${k}"><span class="tile__img"><img src="${m.src}" alt="" loading="lazy">${m.live ? `<span class="tile__badge"><span class="live-dot">${m.kind}</span></span>` : ""}</span><span class="tile__title">${m.title}</span><span class="tile__sub">${m.art === "portrait" ? m.kind.replace("FILM · ", "") + " · " + m.sub.split(" · ")[1] : m.sub}</span></button>`; };
  const openBrowse = (tab) => {
    const cat = CAT[tab]; let g = "cat_all";
    const s = P.sheet({ full: true, body: `<div class="browse"><header class="browse__head">
        <button class="round-btn" type="button" data-close aria-label="${t("close")}">${icon("left")}</button>
        <h2 class="browse__title">${t(TAB_KEY[tab])}</h2><span class="card__more" data-count></span>
        <div class="tabs browse__tabs" role="tablist" data-genres></div></header>
        <div data-sections></div></div>` });
    const draw = () => {
      const genres = g === "cat_all" ? cat.genres : [g];
      const n = cat.items.filter((x) => g === "cat_all" || x.g === g).length;
      s.body.querySelector("[data-genres]").innerHTML = ["cat_all", ...cat.genres].map((x) => `<button type="button" role="tab" aria-selected="${g === x}" data-g="${x}">${t(x)}</button>`).join("");
      s.body.querySelector("[data-count]").textContent = t(COUNT_KEY[tab], n);
      s.body.querySelector("[data-sections]").innerHTML = genres.map((gg) => `<section class="browse__section"><h3 class="browse__sec-title">${t(gg)}</h3><div class="browse__grid is-${tab}">${cat.items.filter((x) => x.g === gg).map((x) => tile(x.id)).join("")}</div></section>`).join("");
      s.body.querySelector(".browse").scrollTop = 0;
    };
    s.body.addEventListener("click", (e) => {
      const x = e.target.closest("[data-g]"); if (x) { g = x.dataset.g; draw(); return; }
      const pl = e.target.closest("[data-play]"); if (pl) openPlayer(pl.dataset.play);
    });
    draw();
  };

  /* 열리는 화면들 */
  const OPEN = {
    // 메뉴 — 1뎁스 목록, '모드'를 누르면 2뎁스로 다섯 모드
    menu() {
      const s = P.sheet({ side: true, title: "MOMEN", body: "" });
      const main = () => {
        const items = [
          ["m_modes", "layers", "modes"], ["m_watch", "film", () => openPlayer("film")], ["m_music", "music", () => openPlayer("audio")],
          ["m_dine", "meal", () => OPEN.dine()], ["map_title", "map", () => OPEN.map()], ["settings", "gear", () => P.openSettings()],
        ];
        s.body.innerHTML = `<nav class="menu-panel">${items.map(([k, ic, act], i) => `<button class="menu-item" type="button" data-i="${i}">${icon(ic)}${t(k)}${act === "modes" ? `<span class="menu-item__end">${t(`name_${S.mode}`)}${icon("right")}</span>` : ""}</button>`).join("")}</nav>`;
        s.body.onclick = (e) => { const b = e.target.closest("[data-i]"); if (!b) return; const act = items[+b.dataset.i][2]; if (act === "modes") return modes(); s.close(); setTimeout(act, 200); };
      };
      const modes = () => {
        const row = (m) => `<button class="mode-item" type="button" data-m="${m}" aria-current="${S.mode === m}"${P.modeOpen(m) ? "" : " disabled aria-disabled=\"true\""}><span class="mode-item__name">${t(`name_${m}`)}</span></button>`;
        s.body.innerHTML = `<button class="menu-back" type="button" data-back>${icon("left")}${t("back")}</button>
          ${["ENJOY", "REST", "WORK"].map(row).join("")}
          <div class="menu-gap"></div>${P.OUT_MODES.map(row).join("")}`;
        s.body.onclick = (e) => {
          if (e.target.closest("[data-back]")) return main();
          const b = e.target.closest("[data-m]"); if (!b) return;
          s.close(); if (b.dataset.m !== S.mode) setTimeout(() => setMode(b.dataset.m), 200);
        };
      };
      main();
    },
    map() {
      const p = elapsed / TOTAL;
      // 주간 지구본(assets/map/globe-day.jpg)과 같은 정사영 파라미터 — 이미지를 다시 만들면 여기도 맞춰야 함
      const D = Math.PI / 180, L0 = 64 * D, P0 = 24 * D, R = 520, CX = 448, CY = 503;
      const ll = (lat, lon) => [Math.cos(lat * D) * Math.cos(lon * D), Math.cos(lat * D) * Math.sin(lon * D), Math.sin(lat * D)];
      const A = ll(37.5, 127), B = ll(49, 2.3), om = Math.acos(A[0] * B[0] + A[1] * B[1] + A[2] * B[2]);
      const scr = (v, k) => {
        const la = Math.asin(v[2]), lo = Math.atan2(v[1], v[0]);
        return [CX + R * k * Math.cos(la) * Math.sin(lo - L0), CY - R * k * (Math.cos(P0) * Math.sin(la) - Math.sin(P0) * Math.cos(la) * Math.cos(lo - L0))];
      };
      // 대권 항로 위의 점(u: 0=출발, 1=도착). 중간은 지표 위로 살짝 떠올라 3D 호처럼 보임
      const at = (u) => {
        const s0 = Math.sin((1 - u) * om) / Math.sin(om), s1 = Math.sin(u * om) / Math.sin(om);
        return scr([0, 1, 2].map((i) => A[i] * s0 + B[i] * s1), 1 + 0.05 * Math.sin(Math.PI * u));
      };
      const line = (u1) => { const n = Math.max(2, Math.round(u1 * 80)); let d = ""; for (let i = 0; i <= n; i++) { const [x, y] = at(u1 * i / n); d += `${i ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)} `; } return d; };
      const [x0, y0] = scr(A, 1), [x1, y1] = scr(B, 1), [bx, by] = at(p);
      const [fx, fy] = at(Math.min(1, p + .01)), [gx, gy] = at(Math.max(0, p - .01));
      const NAMES = [["Russia", 60, 92], ["Mongolia", 47, 103], ["China", 34, 104], ["Kazakhstan", 48, 67], ["Japan", 36.5, 139], ["India", 22, 78], ["Iran", 32.5, 54], ["Turkey", 39, 35], ["Ukraine", 49, 31.5], ["Germany", 51.5, 10], ["Italy", 42, 12.5], ["Egypt", 27, 30], ["Saudi Arabia", 24, 45], ["Spain", 40, -3.5]];
      const PINS = [[39.9, 116.4], [55.7, 37.6], [41, 29], [28.6, 77.2]];
      const front = (la, lo) => Math.sin(P0) * Math.sin(la * D) + Math.cos(P0) * Math.cos(la * D) * Math.cos((lo - 64) * D) > .28;
      const names = NAMES.filter(([, la, lo]) => front(la, lo)).map(([n, la, lo]) => { const [x, y] = scr(ll(la, lo), 1); return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle">${n}</text>`; }).join("");
      const pins = PINS.filter(([la, lo]) => front(la, lo)).map(([la, lo]) => { const [x, y] = scr(ll(la, lo), 1); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="#F4F5F6" stroke="#06080c" stroke-opacity=".6" stroke-width="1.5"/>`; }).join("");
      const ang = Math.atan2(fy - gy, fx - gx) * 180 / Math.PI + 90;
      const sh = P.sheet({ wide: true, title: t("map_title"), body: `
        <div class="mapbox"><div class="map"><button class="map__full" type="button" data-map-exit aria-label="${t("map_exit")}"><svg><use href="#i-shrink"/></svg></button><svg viewBox="0 0 888 420" preserveAspectRatio="xMidYMid meet">
          <image href="../assets/map/globe-day.jpg" x="-148" y="-37" width="1204" height="543" preserveAspectRatio="none"/>
          <rect x="-148" y="-37" width="1204" height="543" fill="#06080c" fill-opacity=".42"/>
          <defs>
            <radialGradient id="vg" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#08090b" stop-opacity="0"/><stop offset="1" stop-color="#08090b" stop-opacity=".7"/></radialGradient>
            <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="${x0}" x2="${bx}" y1="0" y2="0"><stop offset="0" stop-color="#F4F5F6" stop-opacity=".08"/><stop offset=".7" stop-color="#F4F5F6" stop-opacity=".85"/><stop offset="1" stop-color="#F4F5F6"/></linearGradient>
            <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
          </defs>
          <rect x="-148" y="-37" width="1204" height="543" fill="url(#vg)"/>
          <path d="${line(1)}" fill="none" stroke="#F4F5F6" stroke-opacity=".6" stroke-width="1.6" stroke-dasharray="0.1 6" stroke-linecap="round"/>
          <path d="${line(p)}" fill="none" stroke="#F4F5F6" stroke-opacity=".25" stroke-width="5" filter="url(#glow)"/>
          <path d="${line(p)}" fill="none" stroke="#F4F5F6" stroke-width="3" stroke-linecap="round"/>
          <g font-family="Pretendard Variable">
            <g fill="#F4F5F6" fill-opacity=".92" font-size="13" font-weight="500" stroke="#0a1220" stroke-opacity=".55" stroke-width="2.6" paint-order="stroke" stroke-linejoin="round">${names}</g>
            ${pins}
            <circle cx="${x0}" cy="${y0}" r="5" fill="#F4F5F6"/><circle cx="${x0}" cy="${y0}" r="11" fill="none" stroke="#F4F5F6" stroke-opacity=".28"/>
            <text x="${x0}" y="${y0 + 30}" fill="#F4F5F6" font-size="17" font-weight="600" letter-spacing="1.6" text-anchor="middle">ICN</text>
            <text x="${x0}" y="${y0 + 46}" fill="#B3B4B7" font-size="13" text-anchor="middle">Seoul</text>
            <circle cx="${x1}" cy="${y1}" r="5" fill="#08090b" stroke="#F4F5F6" stroke-width="2"/><circle cx="${x1}" cy="${y1}" r="12" fill="none" stroke="#F4F5F6" stroke-opacity=".5"/>
            <text x="${x1}" y="${y1 + 30}" fill="#F4F5F6" font-size="17" font-weight="600" letter-spacing="1.6" text-anchor="middle">CDG</text>
            <text x="${x1}" y="${y1 + 46}" fill="#B3B4B7" font-size="13" text-anchor="middle">Paris</text>
          </g>
          <g transform="translate(${bx} ${by}) rotate(${ang}) scale(2)">
            <path d="M0 -10.5C1 -10.5 1.5 -9.2 1.5 -7.8V-3.4L10 1.6V3.4L1.5 1.4 1.3 6.2 3.8 8V9.4L0 8.4-3.8 9.4V8L-1.3 6.2-1.5 1.4-10 3.4V1.6L-1.5-3.4V-7.8C-1.5-9.2-1-10.5 0-10.5Z" fill="#F4F5F6"/>
          </g>
        </svg></div>
        <dl class="stats">
          <div class="stat"><dt>${t("altitude")}</dt><dd class="num">11,280 m</dd></div>
          <div class="stat"><dt>${t("speed")}</dt><dd class="num">905 km/h</dd></div>
          <div class="stat"><dt>${t("outside")}</dt><dd class="num">−54°</dd></div>
          <div class="stat"><dt>${t("distance")}</dt><dd class="num">${Math.round(8950 * (1 - p)).toLocaleString()} km</dd></div>
        </dl></div>` });
      const mapEl = sh.body.querySelector(".mapbox"), head = sh.el.querySelector(".sheet__head");
      const fullBtn = document.createElement("button");
      fullBtn.className = "round-btn"; fullBtn.type = "button"; fullBtn.setAttribute("aria-label", t("map_full")); fullBtn.innerHTML = '<svg><use href="#i-expand"/></svg>';
      const tools = document.createElement("div"); tools.className = "sheet__tools";
      tools.append(fullBtn, head.querySelector("[data-close]")); head.append(tools);
      fullBtn.addEventListener("click", () => { if (mapEl.requestFullscreen) mapEl.requestFullscreen(); });
      sh.body.querySelector("[data-map-exit]").addEventListener("click", () => document.exitFullscreen());
    },
    notifs() {
      const list = [["meal", t("meal_title"), t("now")], ["ball", t("n_match"), clock(elapsed)], ["moon", t("n_sleep").replace("22:40", clock(S.sleepAt)), clock(S.sleepAt)]];
      P.sheet({ title: t("notifications"), body: `<div>${list.map(([ic, text, time]) => `<div class="notif"><span class="notice__icon">${icon(ic)}</span><span class="row__name">${text}</span><span class="notif__time num">${time}</span></div>`).join("")}</div>${S.dnd ? `<p class="note">${t("n_empty_dnd")}</p>` : ""}` });
      $("[data-badge]").hidden = true;
    },
    settings() { P.openSettings(); },
    seat() {
      const poses = { upright: "M20 52h20M24 52V18M24 40h18", lounge: "M14 52h28M20 52l-6-30M20 44h22", bed: "M8 44h48M8 44V34M8 36h48" };
      const s = P.sheet({ title: t("seat_title"), body: `<div class="seat-pose" role="radiogroup">${Object.keys(poses).map((k) => `<button class="pose" type="button" role="radio" aria-checked="${S.seatPose === k}" data-pose="${k}"><svg viewBox="0 0 64 64"><path d="${poses[k]}" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>${t(k)}</button>`).join("")}</div>`, onClose: () => { if (S.mode === "WORK") render(); } });
      s.body.addEventListener("click", (e) => { const b = e.target.closest("[data-pose]"); if (!b) return; S.seatPose = b.dataset.pose; P.save(); s.body.querySelectorAll("[data-pose]").forEach((x) => x.setAttribute("aria-checked", String(x === b))); P.toast(t("t_seat", t(S.seatPose))); });
    },
    dine() {
      const s = P.sheet({ title: t("dine_title"), body: `<div>${["dish1", "dish2"].map((k) => `<div class="dish"><div><p class="dish__name">${t(k)}</p><p class="dish__desc">${t(k + "d")}</p></div><button class="btn ${S.dish === k ? "btn--primary" : "btn--ghost"}" type="button" data-dish="${k}">${t(S.dish === k ? "chosen" : "choose")}</button></div>`).join("")}</div>` });
      s.body.addEventListener("click", (e) => { const b = e.target.closest("[data-dish]"); if (!b) return; S.dish = b.dataset.dish; P.save(); s.close(); P.toast(t("t_dish", t(S.dish))); });
    },
    qr() {
      const s = P.sheet({ title: t("qr_title"), body: `<div class="qr">${qrSvg()}<div><p class="notice__body" style="font-size:17px;line-height:1.55">${t("qr_desc")}</p><p class="qr__state" data-qs><span class="spinner"></span>${t("qr_waiting")}</p></div></div>` });
      setTimeout(() => { const q = s.body.querySelector("[data-qs]"); if (!q) return; q.classList.add("is-done"); q.innerHTML = `${icon("check")}${t("t_sent")}`; q.querySelector("svg").style.cssText = "width:18px;height:18px;color:var(--text-1)"; P.toast(t("t_sent")); }, 2400);
    },
    journal() {
      const s = P.sheet({ title: t("record"), body: `
        <textarea class="journal" placeholder="${t("record_ph")}" data-j></textarea>
        <div class="sheet__foot"><span class="card__more">${t("entries", S.entries.length)}</span><button class="btn btn--primary" type="button" data-save-j>${t("record_save")}</button></div>
        <div>${S.entries.slice().reverse().map((x) => `<p class="entry"><time class="num">${x.at}</time>${esc(x.text)}</p>`).join("")}</div>` });
      setTimeout(() => s.body.querySelector("[data-j]").focus(), 60);
      s.body.querySelector("[data-save-j]").addEventListener("click", () => {
        const v = s.body.querySelector("[data-j]").value.trim(); if (!v) return;
        S.entries.push({ text: v, at: `${clock(elapsed)} · ${Math.round(elapsed / TOTAL * 8950).toLocaleString()} km` }); P.save(); s.close(); render(); P.toast(t("t_recorded"));
      });
    },
    share() {
      const link = "momen.travel/j/32A-ICN-CDG";
      const s = P.sheet({ title: t("share"), body: `
        <p class="notice__body" style="margin:-8px 0 20px">${t("share_desc")}</p>
        <div class="qr" style="grid-template-columns:200px 1fr">${qrSvg(200)}<div class="share-link"><span>${link}</span><button class="btn btn--primary" type="button" data-copy>${t("copy_link")}</button></div></div>` });
      s.body.querySelector("[data-copy]").addEventListener("click", () => { try { navigator.clipboard && navigator.clipboard.writeText(`https://${link}`); } catch (e) {} P.toast(t("t_copied")); });
    },
  };
  stage.addEventListener("click", (e) => { const b = e.target.closest("[data-open]"); if (b && OPEN[b.dataset.open]) OPEN[b.dataset.open](); });

  // QR 모양 — 보기용 패턴
  const qrSvg = (size = 240) => {
    let seed = 7, cells = "";
    const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const n = 25, finder = (x, y) => (x < 7 && y < 7) || (x > n - 8 && y < 7) || (x < 7 && y > n - 8);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!finder(x, y) && rnd() > .5) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    const f = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#F4F5F6"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3"/>`;
    return `<svg viewBox="0 0 25 25" style="width:${size}px;height:${size}px" shape-rendering="crispEdges" fill="#090A0C">${cells}${f(0, 0)}${f(18, 0)}${f(0, 18)}</svg>`;
  };

  /* 플레이어 */
  const openPlayer = (key, fromStart = false) => {
    const m = media(key); let pos = fromStart ? 0 : m.pos, playing = true;
    const s = P.sheet({ full: true, body: `
      <div class="player${m.art ? ` is-art is-${m.art}` : ""}${m.live ? " is-live" : ""}">
        <img src="${m.src}" alt="">
        <div class="player__top">
          <button class="round-btn" type="button" data-close aria-label="${t("close")}">${icon("left")}</button>
          ${key === "psg" ? `<div class="player__score"><span class="live-dot">LIVE</span></div>` : `<span class="card__more">${t("playing")}</span>`}
        </div>
        <div class="player__bottom">
          ${m.art ? `<img class="player__cover" src="${m.src}" alt="">` : ""}
          <p class="player__kind">${m.kind}</p>
          <h2 class="player__title">${m.title}</h2>${m.sub ? `<p class="player__sub">${m.sub}</p>` : ""}
          <div class="player__bar" data-bar><i data-fill></i></div>
          <div class="player__row num"><span data-pos></span><span>${fmt2(m.dur)}</span></div>
          <div class="player__ctrls">
            <button class="round-btn skip" type="button" data-skip="-10">−10</button>
            <button class="round-btn play-main" type="button" data-pp>${icon("pause")}</button>
            <button class="round-btn skip" type="button" data-skip="10">+10</button>
          </div>
        </div>
      </div>`, onClose: () => clearInterval(timer) });
    const b = s.body;
    const draw = () => {
      b.querySelector("[data-fill]").style.width = `${(pos / m.dur) * 100}%`;
      b.querySelector("[data-pos]").textContent = fmt2(pos);
      const mn = b.querySelector("[data-min]"); if (mn) mn.textContent = `${Math.floor(pos / 60)}'`;
    };
    const timer = setInterval(() => { if (playing && pos < m.dur) { pos += 1; draw(); } }, 1000);
    b.addEventListener("click", (e) => {
      if (e.target.closest("[data-pp]")) { playing = !playing; b.querySelector("[data-pp]").innerHTML = icon(playing ? "pause" : "play"); }
      const sk = e.target.closest("[data-skip]"); if (sk) { pos = Math.min(m.dur, Math.max(0, pos + +sk.dataset.skip)); draw(); }
      const bar = e.target.closest("[data-bar]"); if (bar) { const r = bar.getBoundingClientRect(); pos = Math.round(((e.clientX - r.left) / r.width) * m.dur); draw(); }
    });
    draw();
  };

  /* 수면 화면 */
  const sleepEl = $("[data-sleep]");
  const goSleep = () => {
    $("[data-sleep-clock]").textContent = clock(elapsed);
    $("[data-sleep-sub]").textContent = `${t("wake_meal")} · ${clock(S.wakeAt)}`;
    $("[data-wake]").textContent = t("wake_up");
    sleepEl.classList.add("is-on"); P.toast(t("t_sleep"));
  };
  sleepEl.addEventListener("click", () => sleepEl.classList.remove("is-on"));

  /* 상단 토글 */
  const markToggles = () => document.querySelectorAll("[data-toggle]").forEach((b) => { const on = !!S[b.dataset.toggle]; b.classList.toggle("is-on", on); b.setAttribute("aria-pressed", String(on)); b.title = t(b.dataset.toggle === "light" ? (on ? "t_light_on" : "t_light_off") : (on ? "t_call" : "t_call_off")); });
  stage.addEventListener("click", (e) => {
    const b = e.target.closest("[data-toggle]"); if (!b) return;
    const k = b.dataset.toggle; S[k] = !S[k]; P.save(); markToggles();
    P.toast(k === "light" ? t(S.light ? "t_light_on" : "t_light_off") : t(S.call ? "t_call" : "t_call_off"));
  });

  /* 시계 */
  const tick = () => { $("[data-remaining]").textContent = P.hm(TOTAL - elapsed); };
  setInterval(() => { elapsed = Math.min(TOTAL, elapsed + 1); tick(); if (S.mode === "REST") render(); }, 60000);

  addEventListener("proto:lang", () => { tick(); $("[data-mode-name]").textContent = t(`name_${S.mode}`); render(); });

  P.init();
  markToggles();
  setMode(S.mode, { quiet: true });
})();
</script>
</body>
</html>
