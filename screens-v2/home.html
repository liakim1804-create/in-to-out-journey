<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOMEN IFE — Home</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="proto.css?v=1006215408">
<style>
/* 모드별 화면 — 상단 바만 공통, 아래는 모드마다 레이아웃이 다르다. 모드 전환은 메뉴 2뎁스 */

/* 배경 */
.backdrop { position: absolute; inset: 0; z-index: -1; }
.backdrop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .9s var(--ease); }
.backdrop img.is-on { opacity: var(--bg-op, .35); }
.stage[data-mode="REST"] { --bg-op: .38; }
.stage[data-mode="REST"][data-rest-light="dark"] { --bg-op: .16; }
.stage[data-mode="REST"][data-rest-light="bright"] { --bg-op: .55; }
.stage[data-mode="WORK"] { --bg-op: .16; }
.stage[data-mode="ENJOY"], .stage[data-mode="PREPARE"], .stage[data-mode="TRAVEL"] { --bg-op: 0; }

/* 상단 바 */
.topbar { position: absolute; left: 64px; right: 64px; top: 40px; height: 56px; display: flex; align-items: center; justify-content: space-between; z-index: 5; }
.topbar__group { display: flex; align-items: center; gap: 12px; }
.pill__mode { padding-left: 12px; margin-left: 2px; border-left: 1px solid var(--hairline); color: var(--text-2); font-weight: 500; }
.wordmark { position: absolute; left: 50%; transform: translateX(-50%); font: 700 17px/1 var(--font); letter-spacing: .32em; padding-left: .32em; }
.status { height: 44px; padding: 0 6px; display: flex; align-items: center; gap: 2px; border-radius: 999px; background: var(--glass); box-shadow: inset 0 0 0 var(--hair, 1px) var(--hairline); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); }
.status button, .status > span { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--text-1); position: relative; transition: background .2s var(--ease), color .2s var(--ease); }
.status button:hover { background: var(--glass-strong); color: var(--text-1); }
.status svg { width: 21px; height: 21px; stroke-width: 1.9; }
.status .is-on { color: var(--text-1); }
.status button.is-on { background: var(--glass-strong); }
.status__sep { display: block; width: 1px; height: 16px; background: var(--hairline); margin: 0 4px; }
.badge { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--c-50); box-shadow: 0 0 0 2px var(--c-900); }

/* 화면 영역 */
.view { position: absolute; left: 64px; right: 64px; top: 128px; bottom: 64px; }
.view.is-swap { animation: viewIn .55s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(14px); } }

/* 공통 조각 */
.eyebrow { font: 500 15px/1.2 var(--font); letter-spacing: 0; color: var(--text-3); display: flex; align-items: center; gap: 10px; }
.eyebrow i { width: 4px; height: 4px; border-radius: 50%; background: var(--c-600); }
.eyebrow b { color: var(--a-200); font-weight: 600; }
.h-hero { font: var(--t-hero); letter-spacing: -0.035em; }
.h-sub { font: 400 19px/1.6 var(--font); letter-spacing: -0.012em; color: var(--text-2); }
.card { border-radius: var(--r-lg); background: rgba(26, 28, 30, .74); box-shadow: inset 0 0 0 var(--hair, 1px) var(--hairline); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); padding: 28px; }
.card__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.card__title { font: 600 20px/1.3 var(--font); letter-spacing: -0.018em; }
.card__more { font: var(--t-caption); color: var(--text-3); text-align: right; }
.row { display: grid; grid-template-columns: 64px 1fr auto; gap: 16px; align-items: center; padding: 10px; margin: 0 -10px; border-radius: var(--r-sm); text-align: left; transition: background .2s var(--ease); }
button.row:hover { background: var(--glass); }
.thumb { width: 64px; height: 64px; border-radius: 14px; display: grid; place-items: center; background: var(--c-800); box-shadow: inset 0 0 0 var(--hair, 1px) var(--hairline); overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.row__name { display: block; font: 600 16px/1.35 var(--font); letter-spacing: -0.014em; }
.row__sub { display: flex; gap: 8px; align-items: center; margin-top: 3px; font: var(--t-caption); color: var(--text-3); }
.mini { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--glass-strong); color: var(--text-1); flex: none; }
.mini svg { width: 14px; height: 14px; }
.live-dot { display: inline-flex; align-items: center; gap: 6px; color: var(--a-200); font-weight: 600; }
.live-dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c-50); box-shadow: 0 0 8px rgba(244, 245, 246, .6); animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.bar { display: block; height: 3px; border-radius: 3px; background: rgba(244, 245, 246, .16); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c-50); border-radius: inherit; }
.notice__icon { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--glass-strong); color: var(--text-1); flex: none; }
.notice__icon svg { width: 20px; height: 20px; }
.notice__title { font: 600 17px/1.4 var(--font); letter-spacing: -0.014em; }
.notice__body { margin-top: 4px; font: var(--t-small); letter-spacing: -0.008em; color: var(--text-2); }
.actions { display: flex; gap: 8px; align-items: center; }
.chip { font: 600 13px/1.2 var(--font); letter-spacing: 0; color: var(--a-200); padding: 6px 10px; border-radius: 999px; background: rgba(225, 169, 116, .12); white-space: nowrap; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px solid var(--hairline); }
.switch-row:first-of-type { border-top: 0; padding-top: 0; }
.switch-row__label { font: 500 16px/1.4 var(--font); letter-spacing: -0.01em; }
.switch-row__desc { display: block; margin-top: 2px; font: var(--t-caption); color: var(--text-3); }
.save-btn { height: 44px; padding: 0 18px; border-radius: 999px; font: 600 15px/1 var(--font); background: var(--glass-strong); white-space: nowrap; }
.save-btn[aria-pressed="true"] { box-shadow: var(--sel); background: transparent; color: var(--text-1); }
.tabs { display: flex; gap: 8px; }
.tabs button { height: 48px; padding: 0 20px; border-radius: 999px; font: 600 16px/1 var(--font); letter-spacing: -0.012em; color: var(--text-3); transition: background .2s var(--ease), color .2s var(--ease); }
.tabs button:hover { color: var(--text-1); }
.tabs button[aria-selected="true"] { box-shadow: var(--sel); background: transparent; color: var(--text-1); }
.facts { display: flex; gap: 40px; }
.fact dt { font: 500 15px/1.2 var(--font); letter-spacing: 0; color: var(--text-3); }
.fact dd { margin-top: 8px; font: 600 26px/1.15 var(--font); letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }

/* ── 공통 그리드: 1792×912 영역을 12열(131px) · 간격 20px로 나눈다 ── */
.view { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; }
.view > * { min-width: 0; min-height: 0; }
.fill { display: flex; flex-direction: column; }
.fill > .grow { flex: 1; min-height: 0; }
.c1-12 { grid-column: 1 / 13; } .c1-9 { grid-column: 1 / 10; } .c1-8 { grid-column: 1 / 9; } .c1-6 { grid-column: 1 / 7; } .c1-4 { grid-column: 1 / 5; }
.c5-8 { grid-column: 5 / 9; } .c7-12 { grid-column: 7 / 13; } .c9-12 { grid-column: 9 / 13; } .c10-12 { grid-column: 10 / 13; }
.c1-3 { grid-column: 1 / 4; } .c4-6 { grid-column: 4 / 7; } .c7-9 { grid-column: 7 / 10; } .c10-12b { grid-column: 10 / 13; }

/* ── 감상: 대표 / 탭 / 포스터 4 ── */
.view[data-mode="ENJOY"] { grid-template-rows: 1fr 44px 280px; }
.enjoy-feature { position: relative; grid-row: 1; border-radius: 32px; overflow: hidden; background: var(--c-900); }
.enjoy-feature > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.enjoy-feature::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(9, 10, 12, .92) 0%, rgba(9, 10, 12, .6) 40%, rgba(9, 10, 12, .3) 75%, rgba(9, 10, 12, .35) 100%), linear-gradient(rgba(9, 10, 12, .3), rgba(9, 10, 12, .3)), linear-gradient(0deg, rgba(9, 10, 12, .85) 0%, transparent 45%); }
.enjoy-feature__body { position: absolute; left: 56px; bottom: 52px; z-index: 1; max-width: 900px; }
.enjoy-feature__title { margin-top: 16px; font: 700 88px/1.02 var(--font); letter-spacing: -0.045em; }
.enjoy-feature__meta { margin-top: 18px; display: flex; gap: 14px; align-items: center; font: var(--t-body); color: var(--text-2); }
.enjoy-feature__meta b { color: var(--text-1); font-weight: 600; font-variant-numeric: tabular-nums; }
.enjoy-feature .actions { margin-top: 30px; }
/* 기내식 카드는 그리드 오른쪽 4칸 폭에 맞춘다 */
.meal-float { position: absolute; right: 32px; bottom: 32px; z-index: 1; width: calc((100% - 220px) / 12 * 4 + 60px - 32px); display: grid; grid-template-columns: 44px 1fr; gap: 16px; padding: 24px; }
.meal-float .actions { margin-top: 14px; }
.shelf-head { grid-row: 2; display: flex; align-items: center; justify-content: space-between; }
.poster { grid-row: 3; position: relative; border-radius: 24px; overflow: hidden; text-align: left; background: var(--c-850); box-shadow: inset 0 0 0 var(--hair, 1px) var(--hairline); display: flex; flex-direction: column; justify-content: flex-end; padding: 24px; }
.poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 24%; opacity: .72; transition: transform .6s var(--ease), opacity .3s var(--ease); }
.poster::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(9, 10, 12, .92) 100%); }
.poster > *:not(img) { position: relative; z-index: 1; }
.poster:hover img { transform: scale(1.04); opacity: .85; }
.poster__kind { font: 500 15px/1.2 var(--font); letter-spacing: 0; color: var(--text-2); }
.poster__title { margin-top: 8px; font: 600 24px/1.25 var(--font); letter-spacing: -0.022em; }
.poster .bar { margin-top: 14px; }

/* ── 휴식: 왼쪽 8칸 / 오른쪽 4칸, 4행 ── */
.view[data-mode="REST"] { grid-template-rows: auto repeat(3, 1fr); }
.presets { margin-top: 22px; display: flex; gap: 10px; }
.preset { height: 48px; padding: 0 22px; border-radius: 999px; font: 600 16px/1 var(--font); letter-spacing: -0.012em; color: var(--text-2); background: var(--glass); box-shadow: inset 0 0 0 var(--hair, 1px) var(--hairline); transition: background .2s var(--ease), color .2s var(--ease); }
.preset:hover { background: var(--glass-strong); color: var(--text-1); }
.preset[aria-pressed="true"] { box-shadow: var(--sel); background: transparent; color: var(--text-1); }
.rest-head { grid-row: 1; align-self: center; padding-left: 8px; }
.rest-head .h-sub { margin-top: 14px; }
.rest-head .h-hero { margin-top: 12px; font-size: 60px; }
.sleep-win { grid-row: 2; }
.sleep-bar__track { position: relative; height: 64px; border-radius: 18px; background: rgba(244, 245, 246, .06); box-shadow: inset 0 0 0 var(--hair, 1px) var(--hairline); overflow: hidden; }
.sleep-bar__win { position: absolute; top: 0; bottom: 0; border-radius: 18px; background: transparent; box-shadow: var(--sel); display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 17px/1 var(--font); color: var(--text-1); letter-spacing: -0.01em; transition: left .4s var(--ease), width .4s var(--ease); }
.sleep-bar__win svg { width: 18px; height: 18px; }
.sleep-bar__now { position: absolute; top: 10px; bottom: 10px; width: 2px; border-radius: 2px; background: var(--c-50); }
.sleep-bar__ticks { margin-top: 12px; display: flex; justify-content: space-between; font: var(--t-caption); color: var(--text-3); font-variant-numeric: tabular-nums; }
.time-card { grid-row: 3; display: flex; align-items: center; justify-content: space-between; }
.time-card__label { font: var(--t-small); color: var(--text-3); }
.time-card__value { margin-top: 8px; font: 600 56px/1 var(--font); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.stepper { display: flex; gap: 8px; }
.stepper button { width: 52px; height: 52px; border-radius: 50%; background: var(--glass-strong); display: grid; place-items: center; }
.stepper button svg { width: 18px; height: 18px; }
.sleep-cta { grid-row: 4; display: flex; flex-direction: column; justify-content: space-between; text-align: left; transition: transform .2s var(--ease); }
.sleep-cta:active { transform: scale(.98); }
.sleep-cta svg { width: 32px; height: 32px; }
.sleep-cta__title { font: 600 28px/1.2 var(--font); letter-spacing: -0.025em; }
.sleep-cta__sub { margin-top: 6px; font: var(--t-small); color: var(--text-3); }
.media-card { grid-row: 4; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: end; position: relative; overflow: hidden; text-align: left; }
.media-card > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .45; }
.media-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(9, 10, 12, .9), rgba(9, 10, 12, .3)); }
.media-card > *:not(img) { position: relative; z-index: 1; }
.media-card .mini { width: 52px; height: 52px; }
.rest-r1 { grid-row: 1; } .rest-r2 { grid-row: 2; } .rest-r3 { grid-row: 3; } .rest-r4 { grid-row: 4; }
.dial-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.dial { padding: 14px 8px 12px; border-radius: 16px; text-align: center; box-shadow: inset 0 0 0 var(--hair, 1px) var(--hairline); font: 600 15px/1.3 var(--font); color: var(--text-2); transition: box-shadow .2s var(--ease), background .2s var(--ease), color .2s var(--ease); }
.dial svg { width: 26px; height: 26px; margin: 0 auto 8px; }
.dial[aria-pressed="true"] { box-shadow: var(--sel); background: transparent; color: var(--text-1); }
.dial[aria-pressed="true"] svg { color: var(--text-1); }
.view .card { padding: 26px 28px; }
.view .card__head { margin-bottom: 14px; }

/* ── 업무: 타이머 8칸 × 4행, 오른쪽 4칸 카드 4개 ── */
.view[data-mode="WORK"] { grid-template-rows: repeat(4, 1fr); }
.work-timer { grid-row: 1 / 5; padding: 56px !important; display: flex; flex-direction: column; }
.work-timer .h-sub { margin-top: 12px; }
.timer { margin-top: auto; font: 300 260px/.9 var(--font); letter-spacing: -0.06em; font-variant-numeric: tabular-nums; }
.timer-line { margin-top: 36px; height: 6px; border-radius: 6px; background: rgba(244, 245, 246, .1); overflow: hidden; }
.timer-line i { display: block; height: 100%; width: 0; background: var(--a-400); border-radius: inherit; transition: width 1s linear; }
.timer-ctrls { margin-top: 32px; display: flex; align-items: center; justify-content: space-between; }
.timer-ctrls .btn--lg { height: 60px; padding: 0 32px; font-size: 17px; }
.wifi { display: grid; grid-template-columns: 52px 1fr auto; gap: 16px; align-items: center; }
.wifi__icon { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--c-800); }
.wifi__icon svg { width: 24px; height: 24px; }
.wifi__stat { text-align: right; font: 600 22px/1 var(--font); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.wifi__stat small { display: block; margin-top: 6px; font: var(--t-caption); color: var(--text-3); }
.held__item { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--hairline); transition: filter .3s var(--ease), opacity .3s var(--ease); }
.held__item:first-child { border-top: 0; padding-top: 0; }
.held__item .notice__icon { width: 36px; height: 36px; }
.held__item .notice__icon svg { width: 17px; height: 17px; }
.held.is-hidden .held__item { filter: blur(6px); opacity: .5; }
.count { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 8px; margin-left: 8px; border-radius: 999px; font: 600 14px/1 var(--font); color: var(--c-950); background: var(--c-50); vertical-align: 2px; }
.view[data-mode="WORK"] .switch-row { padding: 9px 0; }

/* ── 준비: 띠 / 체크리스트 6칸 · 교통편 6칸 · 경로 6칸 ── */
.view[data-mode="PREPARE"] { grid-template-rows: 260px 1fr 1fr; }
.prep-band { grid-row: 1; position: relative; border-radius: 32px; overflow: hidden; }
.prep-band > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .8; }
.prep-band::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(9, 10, 12, .9) 0%, rgba(9, 10, 12, .5) 50%, rgba(9, 10, 12, .2) 100%); }
.prep-band__body { position: absolute; left: 56px; right: 56px; top: 44px; bottom: 40px; z-index: 1; display: flex; align-items: flex-end; justify-content: space-between; }
.prep-band .h-hero { font-size: 60px; margin-top: 12px; }
.prep-steps { grid-row: 2 / 4; }
.vsteps { display: flex; flex-direction: column; justify-content: space-between; }
.vstep { position: relative; display: grid; grid-template-columns: 56px 1fr auto; gap: 22px; align-items: center; width: 100%; flex: 1; text-align: left; }
.vstep + .vstep { border-top: 1px solid var(--hairline); }
.vstep__num { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font: 600 19px/1 var(--font); box-shadow: inset 0 0 0 var(--hair, 1px) rgba(244, 245, 246, .22); transition: background .2s var(--ease); }
.vstep__num svg { width: 22px; height: 22px; }
.vstep.is-done .vstep__num { background: var(--c-50); color: var(--c-950); box-shadow: none; }
.vstep__name { display: block; font: 600 24px/1.3 var(--font); letter-spacing: -0.022em; }
.vstep.is-done .vstep__name { color: var(--text-3); text-decoration: line-through; text-decoration-color: rgba(244, 245, 246, .35); }
.vstep__desc { display: block; margin-top: 6px; font: var(--t-body); color: var(--text-2); }
.vstep__meta { font: 600 22px/1 var(--font); letter-spacing: -0.02em; color: var(--text-2); font-variant-numeric: tabular-nums; }
.prep-r2 { grid-row: 2; } .prep-r3 { grid-row: 3; }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.choice { padding: 20px 22px; border-radius: 20px; text-align: left; box-shadow: inset 0 0 0 var(--hair, 1px) var(--hairline); transition: box-shadow .2s var(--ease), background .2s var(--ease); display: flex; flex-direction: column; }
.choice[aria-checked="true"] { box-shadow: var(--sel); background: transparent; }
.choice__top { display: flex; justify-content: space-between; align-items: center; min-height: 28px; }
.choice__top svg { width: 26px; height: 26px; color: var(--text-2); }
.choice__name { display: block; margin-top: auto; font: 600 22px/1.3 var(--font); letter-spacing: -0.02em; }
.choice__sub { display: block; margin-top: 4px; font: var(--t-small); color: var(--text-3); }
.route-card { display: grid; grid-template-columns: 1fr 168px; gap: 28px; align-items: stretch; }
.route-card__info { display: flex; flex-direction: column; }
.route-line { display: flex; align-items: center; gap: 12px; font: 600 19px/1.4 var(--font); letter-spacing: -0.016em; }
.route-line svg { width: 22px; height: 22px; color: var(--text-2); flex: none; }
.route-card .btn--lg { margin-top: auto; align-self: flex-start; }
.route-card svg.qr-mini { width: 168px; height: 168px; border-radius: 18px; background: var(--c-50); padding: 14px; }

/* ── 여행: 배너 / 머리 / 할 일 3장(3칸씩) · 오른쪽 3칸 ── */
.view[data-mode="TRAVEL"] { grid-template-rows: 300px 44px 1fr; }
.travel-band { grid-row: 1; position: relative; border-radius: 32px; overflow: hidden; }
.travel-band > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 60%; }
.travel-band::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(9, 10, 12, .85) 0%, rgba(9, 10, 12, .3) 55%, transparent 100%), linear-gradient(0deg, rgba(9, 10, 12, .6) 0%, transparent 50%); }
.travel-band__body { position: absolute; left: 56px; bottom: 44px; z-index: 1; }
.travel-band__title { margin-top: 10px; font: var(--t-display); letter-spacing: -0.045em; }
.travel-band__meta { margin-top: 12px; font: var(--t-body); color: var(--text-2); }
.travel-head { grid-row: 2; display: flex; align-items: center; justify-content: space-between; }
.place { grid-row: 3; display: flex; flex-direction: column; border-radius: 24px; overflow: hidden; background: rgba(26, 28, 30, .74); box-shadow: inset 0 0 0 var(--hair, 1px) var(--hairline); }
.place__img { flex: 1; min-height: 0; overflow: hidden; }
.place__img img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s var(--ease); }
.place:hover .place__img img { transform: scale(1.04); }
.place__body { padding: 20px 22px 22px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
.place__name { font: 600 20px/1.3 var(--font); letter-spacing: -0.018em; }
.place__sub { margin-top: 4px; font: var(--t-caption); color: var(--text-3); }
.travel-side { grid-row: 2 / 4; display: flex; flex-direction: column; gap: 20px; }
.travel-side .card:first-child { flex: 1; }
.plan-list { display: flex; flex-direction: column; gap: 12px; }
.plan-item { display: flex; align-items: center; gap: 12px; font: 500 16px/1.4 var(--font); }
.plan-item svg { width: 18px; height: 18px; color: var(--text-2); flex: none; }
.empty { font: var(--t-small); color: var(--text-3); }
.travel-side .actions { flex-wrap: wrap; }

/* 전체 보기 */
.browse-btn { gap: 8px; }
.browse-btn svg { width: 14px; height: 14px; }
.browse-btn .num { color: var(--text-3); font-weight: 500; }
.browse { height: 100%; padding: 40px 64px 80px; overflow: auto; }
.browse__head { position: sticky; top: -40px; z-index: 2; display: flex; align-items: center; gap: 20px; padding: 40px 0 20px; margin-top: -40px; background: var(--c-950); }
.browse__title { font: 600 40px/1.2 var(--font); letter-spacing: -0.03em; }
.browse__tabs { margin-left: auto; }
.browse__section { margin-top: 36px; }
.browse__sec-title { font: 600 24px/1.3 var(--font); letter-spacing: -0.02em; margin-bottom: 18px; }
.browse__grid { display: grid; gap: 28px 20px; }
.browse__grid.is-film, .browse__grid.is-music { grid-template-columns: repeat(8, 1fr); }
.browse__grid.is-live { grid-template-columns: repeat(4, 1fr); }
.tile { text-align: left; display: flex; flex-direction: column; min-width: 0; }
.tile__img { position: relative; display: block; border-radius: 16px; overflow: hidden; background: var(--c-850); box-shadow: inset 0 0 0 var(--hair, 1px) var(--hairline); }
.tile.is-portrait .tile__img { aspect-ratio: 2 / 3; }
.tile.is-square .tile__img { aspect-ratio: 1; }
.tile.is-wide .tile__img { aspect-ratio: 16 / 9; display: grid; place-items: center; }
.tile__img img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--ease); }
.tile.is-wide .tile__img img { width: 60%; height: 60%; object-fit: contain; }
.tile:hover .tile__img img { transform: scale(1.04); }
.tile__badge { position: absolute; left: 12px; top: 12px; padding: 6px 10px; border-radius: 999px; background: rgba(9, 10, 12, .7); font: var(--t-label); }
.tile__title { margin-top: 12px; font: 600 16px/1.35 var(--font); letter-spacing: -0.014em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile__sub { margin-top: 3px; font: var(--t-caption); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 선반 타일 — 실제 포스터 */
.poster--art { padding-left: 196px; }
.poster--art img.poster__bg { filter: blur(28px) saturate(1.1); transform: scale(1.3); opacity: .55; }
.poster--art:hover img.poster__bg { transform: scale(1.34); opacity: .65; }
.poster--art img.poster__cover { position: absolute; inset: auto; z-index: 1; left: 24px; top: 24px; bottom: 24px; height: calc(100% - 48px); width: auto; opacity: 1; border-radius: 12px; box-shadow: 0 16px 40px rgba(0, 0, 0, .5); object-fit: cover; }
.poster--art.is-portrait img.poster__cover { aspect-ratio: 2 / 3; }
.poster--art.is-square img.poster__cover { aspect-ratio: 1; top: auto; height: 148px; }
.poster--art.is-wide img.poster__cover { aspect-ratio: 1; top: auto; height: 120px; object-fit: contain; background: rgba(9, 10, 12, .5); padding: 14px; }
.poster--art.is-square, .poster--art.is-wide { padding-left: 24px; justify-content: flex-start; }
.poster--art.is-square .poster__kind, .poster--art.is-wide .poster__kind { margin-top: 0; }
.poster__sub { margin-top: 4px; font: var(--t-caption); color: var(--text-3); }

/* 플레이어 — 실제 포스터 */
.player.is-art > img:first-child { filter: blur(48px) saturate(1.1); transform: scale(1.2); opacity: .5; }
.player__cover { display: block; height: 300px; width: auto; border-radius: 18px; margin-bottom: 28px; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); }
.player.is-square .player__cover, .player.is-wide .player__cover { height: 240px; }
.player.is-wide .player__cover { background: rgba(9, 10, 12, .5); padding: 24px; }
.player__sub { margin-top: 8px; font: var(--t-body); color: var(--text-2); }

/* 시트 내부 */
.menu-panel { display: flex; flex-direction: column; gap: 4px; }
.menu-item { display: flex; align-items: center; gap: 16px; height: 60px; padding: 0 16px; margin: 0 -16px; border-radius: 16px; font: 600 19px/1 var(--font); letter-spacing: -0.016em; text-align: left; transition: background .2s var(--ease); }
.menu-item:hover { background: var(--glass); }
.menu-item > svg { width: 22px; height: 22px; color: var(--text-2); }
.menu-item__end { margin-left: auto; display: flex; align-items: center; gap: 8px; font: 500 15px/1 var(--font); color: var(--text-3); }
.menu-item__end svg { width: 16px; height: 16px; }
.menu-back { display: flex; align-items: center; gap: 8px; height: 44px; margin-bottom: 8px; font: 600 15px/1 var(--font); color: var(--text-3); }
.menu-back svg { width: 18px; height: 18px; }
.menu-gap { height: 1px; margin: 12px 0; background: var(--hairline); }
.mode-item { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; width: calc(100% + 20px); min-height: 64px; padding: 10px 14px; margin: 0 -10px; border-radius: 16px; text-align: left; transition: background .2s var(--ease); }
.mode-item:hover { background: var(--glass); }
.mode-item:disabled { opacity: .35; cursor: not-allowed; }
.mode-item:disabled:hover { background: none; }
.mode-item img { width: 56px; height: 56px; border-radius: 14px; object-fit: cover; }
.mode-item__name { display: block; font: 600 20px/1.3 var(--font); letter-spacing: -0.016em; }
.mode-item__lead { display: block; margin-top: 2px; font: var(--t-caption); color: var(--text-3); }
.mode-item[aria-current="true"] { box-shadow: var(--sel); background: transparent; }
.notif { display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center; padding: 14px 0; border-top: 1px solid var(--hairline); }
.notif:first-child { border-top: 0; }
.notif .notice__icon { width: 40px; height: 40px; }
.notif__time { font: var(--t-caption); color: var(--text-3); }
.note { margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: var(--glass); font: var(--t-small); color: var(--text-2); }
.qr { display: grid; grid-template-columns: 240px 1fr; gap: 32px; align-items: center; }
.qr svg { border-radius: 20px; background: var(--c-50); padding: 16px; }
.qr__state { margin-top: 20px; display: flex; align-items: center; gap: 10px; font: var(--t-small); color: var(--text-2); }
.qr__state.is-done { color: var(--text-1); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(244, 245, 246, .2); border-top-color: var(--c-50); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.map { position: relative; height: 420px; border-radius: 24px; overflow: hidden; background: radial-gradient(120% 120% at 50% 110%, #1b2230 0%, #0d1016 60%, #08090b 100%); box-shadow: inset 0 0 0 var(--hair, 1px) var(--hairline); }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map__full { display: none; position: absolute; top: 24px; right: 24px; z-index: 2; width: 44px; height: 44px; border-radius: 50%; place-items: center; color: var(--text-1); background: var(--glass); box-shadow: inset 0 0 0 var(--hair, 1px) var(--hairline); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); transition: background .2s var(--ease); }
.map__full:hover { background: var(--glass-strong); }
.map__full svg { position: static; width: 20px; height: 20px; }
.sheet__tools { display: flex; align-items: center; gap: 8px; }
.mapbox:fullscreen { position: relative; background: #08090b; }
.mapbox:fullscreen .map { position: absolute; inset: 0; height: auto; border-radius: 0; box-shadow: none; background: #08090b; }
.mapbox:fullscreen .map__full { display: grid; }
.mapbox:fullscreen .stats { position: absolute; left: 32px; right: 32px; bottom: 32px; z-index: 2; margin: 0; }
.mapbox:fullscreen .stat { background: rgba(22, 24, 26, .46); box-shadow: inset 0 0 0 var(--hair, 1px) rgba(244, 245, 246, .12), 0 20px 50px -20px rgba(0, 0, 0, .6); -webkit-backdrop-filter: blur(28px) saturate(1.2); backdrop-filter: blur(28px) saturate(1.2); }
.stats { margin-top: 24px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.stat { padding: 18px 20px; border-radius: 18px; background: var(--glass); }
.stat dt { font: var(--t-caption); color: var(--text-3); }
.stat dd { margin-top: 6px; font: 600 26px/1.15 var(--font); letter-spacing: -0.025em; }
.dish { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; padding: 18px 0; border-top: 1px solid var(--hairline); }
.dish:first-child { border-top: 0; }
.dish__name { font: 600 19px/1.3 var(--font); letter-spacing: -0.016em; }
.dish__desc { margin-top: 4px; font: var(--t-small); color: var(--text-3); }
.journal { width: 100%; height: 180px; resize: none; padding: 18px 20px; border-radius: 18px; border: 0; background: var(--glass); box-shadow: inset 0 0 0 var(--hair, 1px) var(--hairline); font: var(--t-body); letter-spacing: -0.012em; color: var(--text-1); outline: none; }
.journal:focus { box-shadow: inset 0 0 0 2px var(--c-400); }
.entry { padding: 14px 0; border-top: 1px solid var(--hairline); font: var(--t-small); color: var(--text-2); }
.entry time { display: block; font: var(--t-caption); color: var(--text-3); margin-bottom: 4px; }
.share-link { display: flex; align-items: center; gap: 12px; padding: 0 8px 0 20px; height: 56px; border-radius: 999px; background: var(--glass); font: var(--t-small); color: var(--text-2); }
.share-link span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat-pose { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.pose { padding: 24px 16px 20px; border-radius: 20px; text-align: center; box-shadow: inset 0 0 0 var(--hair, 1px) var(--hairline); font: 600 16px/1.3 var(--font); transition: box-shadow .2s var(--ease), background .2s var(--ease); }
.pose svg { width: 64px; height: 64px; margin: 0 auto 14px; color: var(--text-2); }
.pose[aria-checked="true"] { box-shadow: var(--sel); background: transparent; }
.pose[aria-checked="true"] svg { color: var(--text-1); }

/* 플레이어 */
.player { position: relative; width: 100%; height: 100%; overflow: hidden; } /* 흐린 배경을 키워도 화면 밖으로 넘치지 않게 */
.player > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .7; }
.player.is-live > img { opacity: 1; }
.player::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, .55) 0%, transparent 25%, transparent 55%, rgba(0, 0, 0, .9) 100%); }
.player > * { position: relative; z-index: 1; }
.player__top { position: absolute; left: 64px; right: 64px; top: 40px; display: flex; justify-content: space-between; align-items: center; }
.player__score { display: flex; align-items: center; gap: 18px; padding: 12px 22px; border-radius: 999px; background: rgba(9, 10, 12, .6); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); font: 600 20px/1 var(--font); font-variant-numeric: tabular-nums; }
.player__bottom { position: absolute; left: 96px; right: 96px; bottom: 64px; }
.player__kind { font: 500 16px/1.2 var(--font); letter-spacing: 0; color: var(--text-2); }
.player__title { margin-top: 10px; font: 700 64px/1.1 var(--font); letter-spacing: -0.04em; }
.player__bar { margin-top: 32px; height: 4px; border-radius: 4px; background: rgba(244, 245, 246, .2); cursor: pointer; }
.player__bar i { display: block; height: 100%; border-radius: inherit; background: var(--c-50); }
.player__row { margin-top: 14px; display: flex; justify-content: space-between; font: var(--t-small); color: var(--text-2); font-variant-numeric: tabular-nums; }
.player__ctrls { margin-top: 24px; display: flex; align-items: center; gap: 16px; }
.player__ctrls .round-btn { width: 64px; height: 64px; }
.player__ctrls .play-main { width: 80px; height: 80px; background: var(--c-50); color: var(--c-950); }
.player__ctrls .play-main svg { width: 28px; height: 28px; }
.player__ctrls .skip { font: 600 14px/1 var(--font); }

/* 잠자기 화면 */
.sleep-screen { position: absolute; inset: 0; z-index: 850; background: #000; display: grid; place-items: center; text-align: center; opacity: 0; pointer-events: none; transition: opacity .8s var(--ease); }
.sleep-screen.is-on { opacity: 1; pointer-events: auto; }
.sleep-screen__time { font: 300 140px/1 var(--font); letter-spacing: -0.04em; color: rgba(244, 245, 246, .28); font-variant-numeric: tabular-nums; }
.sleep-screen__sub { margin-top: 18px; font: var(--t-small); color: rgba(244, 245, 246, .3); }
.sleep-screen .btn { margin-top: 48px; background: rgba(244, 245, 246, .06); color: rgba(244, 245, 246, .5); }

/* ═══ 휴식·업무·준비·여행 — 괘선 + 타이포 레이아웃 ═══ */
.view[data-mode="REST"], .view[data-mode="WORK"], .view[data-mode="PREPARE"], .view[data-mode="TRAVEL"] { display: block; }
.x-root { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.x-cap { font: 600 16px/1.2 var(--font); letter-spacing: -0.01em; color: var(--text-2); }
.x-cap b { color: var(--a-300); font-weight: 600; }
.x-h1 { margin-top: 0; font: 600 64px/1.08 var(--font); letter-spacing: -0.04em; }
.x-sub { margin-top: 12px; font: 400 19px/1.5 var(--font); letter-spacing: -0.012em; color: var(--text-2); }
.x-dim { color: var(--text-3); font: 400 15px/1.5 var(--font); letter-spacing: -0.005em; }
.x-sm { display: block; margin-top: 2px; }
.x-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; }
.x-tag { display: inline-block; margin-left: 10px; padding: 5px 10px; border-radius: 6px; font: 600 13px/1 var(--font); letter-spacing: 0; color: var(--a-200); background: rgba(225, 169, 116, .12); }
.x-link { font: 500 15px/1 var(--font); color: var(--text-2); text-decoration: underline; text-underline-offset: 5px; text-decoration-color: rgba(244, 245, 246, .3); }
.x-tabs { display: flex; gap: 28px; }
.x-tabs button { height: 48px; font: 600 17px/1 var(--font); letter-spacing: -0.012em; color: var(--text-3); border-bottom: 2px solid transparent; transition: color .2s var(--ease), border-color .2s var(--ease); }
.x-tabs button:hover { color: var(--text-2); }
.x-tabs button[aria-pressed="true"], .x-tabs button[aria-selected="true"] { color: var(--text-1); border-bottom-color: var(--c-50); }
.x-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 72px; padding: 8px 0; border-top: 1px solid var(--hairline); font: 500 18px/1.35 var(--font); letter-spacing: -0.012em; }
.x-row svg { width: 20px; height: 20px; color: var(--text-3); flex: none; }
.x-row--btn { width: 100%; text-align: left; }
.x-row--btn:hover svg { color: var(--text-1); }
.x-opt { display: flex; align-items: center; gap: 16px; width: 100%; height: 72px; border-top: 1px solid var(--hairline); text-align: left; font: 500 18px/1 var(--font); letter-spacing: -0.012em; color: var(--text-3); transition: color .2s var(--ease); }
.x-opt svg { width: 22px; height: 22px; flex: none; }
.x-opt::after { content: ""; margin-left: auto; width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--c-600); transition: background .2s var(--ease), box-shadow .2s var(--ease); }
.x-opt:hover { color: var(--text-2); }
.x-opt[aria-pressed="true"] { color: var(--text-1); }
.x-opt[aria-pressed="true"]::after { background: var(--c-50); box-shadow: 0 0 0 4px rgba(244, 245, 246, .14); }
.x-root .stepper button { width: 44px; height: 44px; background: none; box-shadow: inset 0 0 0 var(--hair, 1px) var(--hairline); }
.x-root .stepper button:hover { background: var(--glass); }

/* 휴식 */
.r-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; padding-bottom: 36px; }
.r-head .x-h1 { margin-top: 14px; }
.r-head__act { display: flex; align-items: center; gap: 36px; }
.r-time { padding: 32px 0 36px; border-top: 1px solid var(--hairline); }
.r-time__row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 40px; }
.r-t__line { margin-top: 14px; display: flex; align-items: center; justify-content: space-between; padding-right: 40px; }
.r-t--sum .r-t__line { justify-content: flex-start; }
.r-t__v { font: 600 64px/1 var(--font); letter-spacing: -0.045em; font-variant-numeric: tabular-nums; }
.r-track { position: relative; height: 40px; margin-top: 34px; }
.r-track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--c-600); }
.r-win { position: absolute; top: 50%; height: 6px; margin-top: -3px; border-radius: 6px; background: var(--a-400); }
.r-now { position: absolute; top: 4px; bottom: 4px; width: 2px; margin-left: -1px; background: var(--c-50); }
.r-ticks { display: flex; justify-content: space-between; margin-top: 10px; font: 500 14px/1 var(--font); color: var(--text-3); font-variant-numeric: tabular-nums; }
.r-ctl { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--hairline); }
.r-col { padding: 28px 36px 0; }
.r-col:first-child { padding-left: 0; }
.r-col + .r-col { border-left: 1px solid var(--hairline); }
.r-col .x-cap { margin-bottom: 20px; }
.r-col .x-opt:first-of-type, .r-col .x-row:first-of-type { }

/* 업무 */
.w-root { flex-direction: row; gap: 0; }
.w-main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 64px; }
.w-h1 { font-size: 48px; }
.w-timer { margin-top: auto; font: 300 240px/.9 var(--font); letter-spacing: -0.06em; font-variant-numeric: tabular-nums; }
.w-line { margin-top: 40px; height: 2px; background: var(--hairline); }
.w-line i { display: block; height: 100%; width: 0; background: var(--a-400); transition: width 1s linear; }
.w-ctrl { margin-top: 36px; display: flex; align-items: center; justify-content: space-between; }
.w-ctrl .btn--lg { height: 60px; padding: 0 32px; font-size: 17px; }
.w-side { width: 520px; flex: none; border-left: 1px solid var(--hairline); padding-left: 56px; display: flex; flex-direction: column; }
.w-sec { padding: 0 0 28px; }
.w-sec + .w-sec { padding-top: 24px; border-top: 1px solid var(--hairline); }
.w-sec .x-row:first-of-type { border-top: 0; }
.w-speed { margin-top: 8px; font: 600 64px/1 var(--font); letter-spacing: -0.045em; }
.w-speed small { font-size: 22px; font-weight: 500; letter-spacing: -0.01em; color: var(--text-3); }
.w-held.is-hidden { filter: blur(6px); opacity: .5; }
.w-music { margin-top: auto; border-top: 1px solid var(--hairline); min-height: 84px; }

/* 준비 */
.p-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; padding-bottom: 36px; }
.p-facts { display: flex; }
.p-facts > div { padding: 0 32px; border-left: 1px solid var(--hairline); }
.p-facts > div:first-child { border-left: 0; }
.p-facts dt { font: 500 15px/1 var(--font); letter-spacing: 0; color: var(--text-3); }
.p-facts dd { margin-top: 12px; font: 600 40px/1 var(--font); letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
.p-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 560px; border-top: 1px solid var(--hairline); }
.p-steps { padding: 20px 64px 0 0; display: flex; flex-direction: column; }
.p-step { flex: 1; display: grid; grid-template-columns: 56px 1fr auto; gap: 28px; align-items: center; text-align: left; border-top: 1px solid var(--hairline); }
.p-step:first-of-type { border-top: 0; }
.p-step__n { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font: 600 18px/1 var(--font); box-shadow: inset 0 0 0 var(--hair, 1px) var(--c-600); }
.p-step__n svg { width: 22px; height: 22px; }
.p-step__t b { display: block; font: 600 30px/1.2 var(--font); letter-spacing: -0.03em; }
.p-step__t .x-dim { display: block; margin-top: 6px; font-size: 16px; }
.p-step__m { font: 500 28px/1 var(--font); letter-spacing: -0.03em; color: var(--text-2); }
.p-step.is-done .p-step__n { background: var(--c-50); box-shadow: none; color: var(--c-950); }
.p-step.is-done .p-step__t b { color: var(--text-3); text-decoration: line-through; text-decoration-color: rgba(244, 245, 246, .3); }
.p-side { border-left: 1px solid var(--hairline); padding: 20px 0 0 56px; display: flex; flex-direction: column; }
.p-tr { display: flex; align-items: center; gap: 16px; width: 100%; height: 84px; border-top: 1px solid var(--hairline); text-align: left; color: var(--text-3); transition: color .2s var(--ease); }
.p-tr svg { width: 22px; height: 22px; flex: none; }
.p-tr__n { flex: 1; font: 600 20px/1 var(--font); letter-spacing: -0.02em; }
.p-tr[aria-checked="true"] { color: var(--text-1); box-shadow: inset 3px 0 0 var(--c-50); padding-left: 16px; }
.p-tr[aria-checked="true"] .x-dim { color: var(--text-2); }
.p-route { margin-top: auto; padding: 28px 0 0; border-top: 1px solid var(--hairline); display: flex; justify-content: space-between; gap: 24px; align-items: flex-end; }
.p-route__l { margin: 14px 0 8px; font: 600 20px/1.35 var(--font); letter-spacing: -0.02em; }
.p-route .btn { margin-top: 18px; }
.p-route .qr-mini { flex: none; width: 132px; height: 132px; border-radius: 10px; padding: 8px; background: var(--c-50); }

/* 여행 */
.t-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; padding-bottom: 28px; }
.t-city { margin-top: 0; font: 700 168px/.9 var(--font); letter-spacing: -0.06em; }
.t-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 480px; border-top: 1px solid var(--hairline); }
.t-list { padding: 12px 56px 0 0; display: flex; flex-direction: column; }
.t-place { flex: 1; display: grid; grid-template-columns: 64px 1fr auto auto; gap: 24px; align-items: center; border-top: 1px solid var(--hairline); }
.t-place__i { font: 500 18px/1 var(--font); color: var(--text-3); }
.t-place__t b { display: block; font: 600 30px/1.2 var(--font); letter-spacing: -0.03em; }
.t-place__t .x-dim { display: block; margin-top: 6px; font-size: 16px; }
.t-place .x-tag { margin: 0; }
.t-side { border-left: 1px solid var(--hairline); padding: 12px 0 0 48px; display: flex; flex-direction: column; }
.t-side section { padding-bottom: 24px; }
.t-side section + section { margin-top: auto; padding-top: 24px; border-top: 1px solid var(--hairline); }
.t-note { margin: 4px 0 20px; font: 400 17px/1.55 var(--font); color: var(--text-2); }
